services:
  netpatrol:
    build: .
    container_name: netpatrol
    restart: always
    # Final optimized config: Host networking + Privileged access
    network_mode: host
    privileged: true
    environment:
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - netpatrol_data:/app/data
    env_file:
      - .env

volumes:
  netpatrol_data:
